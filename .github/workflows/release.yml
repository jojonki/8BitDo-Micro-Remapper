name: Release

# Push a tag like v1.0.0 to build the macOS and Windows apps and publish a
# GitHub Release with both. Can also be run by hand (builds only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            asset: 8BitDo-Micro-Remapper-macOS-arm64.zip
          - os: windows-latest
            asset: 8BitDo-Micro-Remapper-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest tests.test_core -v

      - name: Build app
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/remapper.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/8BitDo Micro Remapper.app" "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/8BitDo Micro Remapper" -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          body: |
            ## Downloads
            - **macOS (Apple Silicon)**: `8BitDo-Micro-Remapper-macOS-arm64.zip`
            - **Windows (x64)**: `8BitDo-Micro-Remapper-Windows-x64.zip`

            ## First launch
            - Set the Micro's mode switch to **D** and connect it over Bluetooth or USB.
            - **macOS**: the app is not notarized. Right-click the app → **Open** the first time.
              Then allow it in System Settings → Privacy & Security → **Accessibility**
              (needed to send key presses), and restart the app.
              To stop the Home button opening the Games app: System Settings → Game Controllers →
              Home Button → turn off **Enable Home Button Actions**.
            - **Windows**: unzip and run `8BitDo Micro Remapper.exe`
              (SmartScreen may warn because the app is unsigned → More info → Run anyway).
